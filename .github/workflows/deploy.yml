name: Deploy Screened to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate Build Version Metadata
        run: |
          mkdir -p frontend/public frontend/dist
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cat <<EOF > frontend/public/version.json
          {
            "version": "0.1.0",
            "commitSha": "${SHORT_SHA}",
            "buildTime": "${BUILD_TIME}",
            "timestamp": $(date +%s%3N)
          }
          EOF
          cp frontend/public/version.json frontend/dist/version.json 2>/dev/null || true

      - name: Submit Cloud Build & Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'screened-hackathon' }}
          REGION: europe-west2
          SERVICE_NAME: screened
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="europe-west2-docker.pkg.dev/${PROJECT_ID}/screened-app/screened:${SHORT_SHA}"

          echo "🚀 Building container image via Cloud Build: ${IMAGE_TAG}..."
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --tag="${IMAGE_TAG}" \
            .

          echo "🚀 Applying IAM Roles..."
          PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format="value(projectNumber)")
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/cloudtasks.enqueuer" >/dev/null 2>&1 || true

          echo "🚀 Deploying container to Cloud Run..."
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --image="${IMAGE_TAG}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},ENVIRONMENT=production,COMMIT_SHA=${SHORT_SHA},DIAGNOSTICS_TOKEN=${{ secrets.DIAGNOSTICS_TOKEN }},VITE_GA4_MEASUREMENT_ID=${{ secrets.VITE_GA4_MEASUREMENT_ID }},TASK_QUEUE_NAME=${{ secrets.TASK_QUEUE_NAME }}" \
            --set-secrets="PARALLEL_API_KEY=parallel-api-key:latest,SESSION_SIGNING_KEY=session-signing-key:latest,PARALLEL_WEBHOOK_SECRET=parallel-webhook-secret:latest" \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=5

          URL=$(gcloud run services describe "${SERVICE_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format="value(status.url)")
          echo "=== ✅ Live Deployment Ready: ${URL} ==="
