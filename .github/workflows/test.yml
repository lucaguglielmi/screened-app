name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          GOOGLE_API_KEY: "dummy-offline-key"
          GEMINI_API_KEY: "dummy-offline-key"
          PARALLEL_API_KEY: "dummy-parallel-key"
          PARALLEL_WEBHOOK_SECRET: "dummy-secret"
          ENVIRONMENT: "test"
        run: |
          PYTHONPATH=. pytest
