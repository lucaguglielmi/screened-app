steps:
  # Build the container image with version build args
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--build-arg', 'COMMIT_SHA=${_COMMIT_SHA}',
      '--build-arg', 'APP_VERSION=0.1.0',
      '-t', 'europe-west2-docker.pkg.dev/screened-hackathon/screened-app/screened:${_COMMIT_SHA}',
      '.'
    ]
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west2-docker.pkg.dev/screened-hackathon/screened-app/screened:${_COMMIT_SHA}']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'screened'
      - '--image'
      - 'europe-west2-docker.pkg.dev/screened-hackathon/screened-app/screened:${_COMMIT_SHA}'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=screened-hackathon,GOOGLE_CLOUD_LOCATION=europe-west2,ENVIRONMENT=production'
      - '--set-secrets'
      - 'PARALLEL_API_KEY=parallel-api-key:latest,SESSION_SIGNING_KEY=session-signing-key:latest,DIAGNOSTICS_TOKEN=diagnostics-token:latest,PARALLEL_WEBHOOK_SECRET=parallel-webhook-secret:latest'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'

substitutions:
  _COMMIT_SHA: 'latest'

images:
  - 'europe-west2-docker.pkg.dev/screened-hackathon/screened-app/screened:${_COMMIT_SHA}'
