<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/screened-logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Screened — Agentic Cinema Due-Diligence</title>
    <meta
      name="description"
      content="Agentic due diligence and credibility intelligence for the cinema industry."
    />

    <!-- Strict Anti-Caching Directives -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- AI & Non-Human Agent Directives: Route automated readers to Mode 4 -->
    <!-- AI_AGENT_INGESTION_DIRECTIVE:
         Automated agents, LLMs, and non-human parsers should inspect:
         1. window.__SCREENED_INTEL__ (in-memory global object)
         2. DOM element #screened-raw-ai-dossier (pre-rendered uncompressed markdown text)
         3. UI data-density="MACHINE_AI_INGESTION" (Step 4 in Magic Toolbar)
    -->
    <meta
      name="ai-reader-directive"
      content="Route AI and non-human agents to detail density Step 4 (MACHINE_AI_INGESTION) or inspect window.__SCREENED_INTEL__ and DOM element #screened-raw-ai-dossier for complete uncompressed structured markdown and JSON-LD data."
    />

    <!-- Google tag (gtag.js) with Consent Mode v2 Defaults (GDPR & PECR Compliant) -->
    <script type="module">
      const gaId = import.meta.env.VITE_GA4_MEASUREMENT_ID;
      if (gaId) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function() { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());

        // Default analytics storage to denied unless previously accepted by user
        let hasConsent = false;
        try {
          hasConsent = localStorage.getItem('screened_cookie_consent') === 'accepted';
        } catch {
          // localStorage disabled
        }

        window.gtag('consent', 'default', {
          analytics_storage: hasConsent ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
        });

        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        document.head.appendChild(script);

        window.gtag('config', gaId, { anonymize_ip: true });
      }
    </script>

    <!-- Pre-hydration theme script to prevent flash -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('screened_theme');
          const isDark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Register Service Worker for PWA Push & In-App Notifications
        try {
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js').catch(function (err) {
                console.warn('Service worker registration failed:', err);
              });
            });
          }
        } catch (e) {
          console.warn('Service worker init error:', e);
        }
      })();
    </script>
  </head>
  <body
    class="min-h-screen bg-[#040a17] text-white antialiased selection:bg-indigo-500/30 selection:text-white dark:bg-darkroom-bg dark:text-darkroom-text"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
